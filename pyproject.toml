[project]
name = "weather-forecast-cron"
version = "0.1.0"
description = "Daily Oslo weather forecast fetcher + plotter."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "matplotlib>=3.7.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.scripts]
fetch-forecast = "weather_forecast.api:main"
plot-local = "weather_forecast.local:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pre-commit>=3.7",
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_forecast"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
